services:
  db:
    image: postgres:16-alpine
    container_name: passportiq-db
    environment:
      POSTGRES_USER: passportiq
      POSTGRES_PASSWORD: passportiq_local_dev # local dev only — never reuse anywhere
      POSTGRES_DB: passportiq
    ports:
      - "5432:5432"
    volumes:
      - passportiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passportiq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  passportiq_pgdata:
